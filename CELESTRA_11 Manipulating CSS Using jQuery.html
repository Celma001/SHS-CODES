<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTRA_11 Manipulating CSS Using jQuery</title>
    <script src="https://code.jquery.com/jquery-3.1.1.js"></script>

    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(135deg, #a8e6ff, #d6ffd8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            width: 50%;
            max-width: 300px;
        }

        h2 {
            color: #0d3b66;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #ffffff;
        }

        .box {
            margin-bottom: 15px;
            transition: 0.3s ease;
        }

        p {
            transition: 0.3s ease;
            cursor: pointer;
        }

        p:hover {
            transform: scale(1.05);
            background-color: #b4e1ff !important;
            box-shadow: 0px 6px 50px rgba(0, 0, 0, 0.25) !important;
        }

        #sampleDiv1:hover {
            transform: scale(1.03);
            box-shadow: 0px 0px 100px rgba(255, 223, 200, 1) !important;
        }
    </style>

    <script>
        $(document).ready(function () {

            $("#sampleDiv1").css({
                "background-color": "#fff59d",
                "padding": "20px",
                "border-radius": "20px",
                "width": "100%",            
                "display": "block",
                "box-shadow": "0px 0px 10px rgba(255, 223, 70, 0.8)"
            });

            $("p").css({
                "background-color": "#c7eaff",
                "width": "100%",
                "padding": "14px",
                "border": "2px solid #004c6d",
                "border-radius": "10px",
                "box-shadow": "0 4px 10px rgba(0,0,0,0.15)",
                "font-size": "16px",
                "line-height": "1.5"
            });

        });
    </script>
</head>

<body>
    <div class="container">
        <h2>11 Manipulating CSS Using jQuery</h2>

        <div id="sampleDiv1" class="box">
            <p>LOVE</p>
        </div>

        <div id="sampleDiv2" class="box">
            <p>JOY</p>
        </div>

        <div id="sampleDiv3" class="box">
            <p>HOPE</p>
        </div>
    </div>
</body>
</html>
