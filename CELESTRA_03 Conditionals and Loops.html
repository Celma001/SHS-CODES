<body>
    <h1>03 Conditionals and Loops</h1>
    <div id="output"></div>
 
    <script>
         for (var x = 0; x <= 15; x++) {
            if (x === 0) {
        document.write(x + " is even <br>");
            } else if (x % 2 === 0) {
      document.write(x + " is even <br>");
            } else {
        document.write(x + " is odd <br>");
            }
        }
    </script>
</body>
