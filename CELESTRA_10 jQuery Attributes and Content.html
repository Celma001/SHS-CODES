<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CELESTRA_10jQuery Attributes and Content</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
 body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #99acc0;
    padding: 40px;
    color: #9ab5d0;
    }
    .wrapper {
    max-width: 700px;
    margin: auto;
    background-color: #ffffff;
    padding: 25px;
    border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
  h1 {
    text-align: center;
    color: #2b6cb0;
    margin-bottom: 20px;
    }
  .section {
    margin-bottom: 30px;
    color: #2baeb0;
    }
  label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
   input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
  button {
      padding: 10px 15px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      background-color: #2b6cb0;
      color: white;
      cursor: pointer;
      margin-top: 5px;
    }
   button:hover {
      background-color: #2c5282;
    }
  p {
      font-size: 16px;
      line-height: 1.5;
    }
  a {
      color: #3182ce;
      font-weight: bold;
      text-decoration: none;
    }
  a:hover {
      text-decoration: underline;
    }
  i.note {
      font-size: 14px;
      color: #555;
      margin-top: 5px;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <h1>My jQuery Practice Page</h1>

  <div class="section">
      <label for="textInput">Type any character here (or leave it):</label>
      <input type="text" id="textInput" value="Marriel Angela Celestra">
      <button id="alertTextbox">Show Textbox Value</button>
      <div class="note">This will show whatever's inside the textbox.</div>
    </div>

  <div class="section">
      <p id="infoParagraph">
        This is my activivty about 10 jQuery Attributes and Content, from MAWD-302.
      </p>
      <button id="alertParagraph">Show Paragraph HTML</button>
      <div class="note">You'll see the HTML structure, not just the text.</div>
    </div>

    <div class="section">
     <a href="https://www.sti.edu" id="stiLink">Visit STI College</a><br>
    <button id="alertLink">Show Hyperlink Value</button>
    <div class="note">This shows the actual link behind the text.</div>
    </div>
  </div>

  <script>
  $('#alertTextbox').click(function() {
     const value = $('#textInput').val();
    alert(value);
    });

   $('#alertParagraph').click(function() {
     const htmlContent = $('#infoParagraph').html();
     alert(htmlContent);
    });
   $('#alertLink').click(function() {
     const linkHref = $('#stiLink').attr('href');
     alert(linkHref);
    });
  </script>
</body>
</html>
